<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISCORD BOT LAUNCHER | LIVE GATEWAY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0c10 0%, #12161f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, monospace;
            padding: 1.5rem;
        }

        .bot-panel {
            background: rgba(15, 20, 30, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid rgba(88, 166, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(88, 166, 255, 0.2);
            width: 100%;
            max-width: 720px;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1.2rem 1.8rem;
            background: rgba(8, 12, 20, 0.8);
            border-bottom: 1px solid #2a3a60;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3b6f;
            box-shadow: 0 0 8px #ff3b6f;
            transition: all 0.2s;
        }

        .led.online {
            background: #2bff9c;
            box-shadow: 0 0 12px #2bff9c;
        }

        .title {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff, #8bb5ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            margin-left: auto;
            background: #1e2a3e;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-family: monospace;
            color: #9bb9ff;
        }

        .content {
            padding: 1.8rem;
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #9db4e0;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        .token-input {
            width: 100%;
            background: #010409;
            border: 1px solid #2c3e66;
            border-radius: 1.2rem;
            padding: 0.9rem 1.2rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #eef5ff;
            outline: none;
            transition: 0.2s;
        }

        .token-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .button-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            background: #111827;
            border: 1px solid #2d3f60;
            padding: 0.8rem 0;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: inherit;
            color: #ccdeff;
            cursor: pointer;
            transition: 0.1s linear;
        }

        .btn-start {
            background: #1a2a44;
            border-color: #3b82f6;
            color: white;
        }

        .btn-start:hover {
            background: #28446e;
            transform: scale(0.98);
        }

        .btn-stop {
            border-color: #a02c4a;
            color: #ffb3c6;
        }

        .btn-stop:hover {
            background: #2c1a24;
            border-color: #ff5c7c;
        }

        .log-box {
            background: #03050acc;
            border-radius: 1.2rem;
            border: 1px solid #1e2a44;
            overflow: hidden;
        }

        .log-header {
            padding: 0.6rem 1rem;
            background: #0b0f1a;
            font-size: 0.7rem;
            font-weight: 500;
            border-bottom: 1px solid #1e2a44;
            color: #8aa2d4;
        }

        .log-area {
            height: 280px;
            overflow-y: auto;
            padding: 0.8rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            background: #02040c;
        }

        .log-entry {
            border-left: 2px solid #2f4880;
            padding-left: 0.7rem;
            margin-bottom: 0.6rem;
            color: #c8dbff;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .log-entry.error {
            border-left-color: #ff4d6d;
            color: #ffbacb;
        }

        .log-entry.success {
            border-left-color: #2bff9c;
            color: #c0ffdd;
        }

        .timestamp {
            color: #6f8bc0;
            margin-right: 10px;
            font-size: 0.7rem;
        }

        .footer {
            margin-top: 1rem;
            font-size: 0.65rem;
            text-align: center;
            color: #546e9b;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0f1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #2f4880;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="bot-panel">
    <div class="header">
        <div class="led" id="statusLed"></div>
        <span class="title">⚡ BOT ENGINE</span>
        <span class="badge">GATEWAY v10</span>
    </div>
    <div class="content">
        <div class="input-group">
            <div class="input-label">
                <span>🔑 BOT TOKEN</span>
            </div>
            <input type="password" id="tokenInput" class="token-input" placeholder="ODMyNzQ5MTIzNDU2Nzg5MDE.Gxxxxx.xxxxxx_xxxxxx" autocomplete="off" spellcheck="false">
        </div>
        <div class="button-row">
            <button class="btn btn-start" id="startBtn">▶ START BOT</button>
            <button class="btn btn-stop" id="stopBtn">⏹ STOP BOT</button>
        </div>
        <div class="log-box">
            <div class="log-header">📡 LIVE CONSOLE (WEBSOCKET)</div>
            <div class="log-area" id="logArea">
                <div class="log-entry"><span class="timestamp">[SYSTEM]</span> ✅ Ready. Paste your bot token and press START.</div>
                <div class="log-entry"><span class="timestamp">[INFO]</span> 🔐 Token never leaves your browser. Works with real Discord API.</div>
            </div>
        </div>
        <div class="footer">
            ⚠️ Requires bot token with 'Bot' prefix. Intents: GUILDS, GUILD_MESSAGES, MESSAGE_CONTENT.
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- DOM Elements ----------
        const tokenInput = document.getElementById('tokenInput');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const logArea = document.getElementById('logArea');
        const statusLed = document.getElementById('statusLed');
        
        // ---------- State Variables ----------
        let ws = null;                 // WebSocket connection
        let heartbeatInterval = null;
        let heartbeatAckReceived = true;
        let lastSeq = null;
        let sessionId = null;
        let isBotOnline = false;
        let currentToken = null;
        let reconnectAttempts = 0;
        let intentionalClose = false;
        let expectedHeartbeatInterval = 0;

        // Helper: Add log message with timestamp
        function addLog(message, type = 'info') {
            const logDiv = document.createElement('div');
            logDiv.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            logDiv.innerHTML = `<span class="timestamp">[${time}]</span> ${escapeHtml(message)}`;
            logArea.appendChild(logDiv);
            logDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            // keep log view from exploding
            while(logArea.children.length > 420) logArea.removeChild(logArea.firstChild);
        }

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return 'lt;';
                if(m === '>') return 'gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) { return c; });
        }

        function updateLed(online) {
            if(online) {
                statusLed.classList.add('online');
                statusLed.style.background = '#2bff9c';
                statusLed.style.boxShadow = '0 0 12px #2bff9c';
            } else {
                statusLed.classList.remove('online');
                statusLed.style.background = '#ff3b6f';
                statusLed.style.boxShadow = '0 0 8px #ff3b6f';
            }
        }

        // ---------- Cleanup functions ----------
        function stopHeartbeat() {
            if(heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }

        function closeWebSocket(code = 1000, reason = 'manual') {
            if(ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                try {
                    ws.close(code, reason);
                } catch(e) {}
            }
            ws = null;
        }

        function fullCleanup(resetToken = false) {
            stopHeartbeat();
            closeWebSocket(1000, 'cleanup');
            isBotOnline = false;
            updateLed(false);
            heartbeatAckReceived = true;
            if(resetToken) currentToken = null;
            intentionalClose = false;
        }

        // ---------- Send payload via WS ----------
        function sendJSON(op, data) {
            if(ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ op: op, d: data }));
                return true;
            }
            return false;
        }

        // IDENTIFY payload with all required intents (514 = GUILDS + GUILD_MESSAGES + MESSAGE_CONTENT)
        function sendIdentify(token) {
            const identifyData = {
                token: token,
                intents: 513,   // 1 << 0 (GUILDS) + 1 << 9 (GUILD_MESSAGES) + 1 << 15 (MESSAGE_CONTENT)
                properties: {
                    os: "browser",
                    browser: "DiscordWebTerminal",
                    device: "token_runner"
                },
                presence: {
                    status: "online",
                    since: null,
                    activities: [{ name: "slash commands", type: 0 }],
                    afk: false
                }
            };
            sendJSON(2, identifyData);
            addLog("🔐 SENT IDENTIFY → gateway authenticating...", "info");
        }

        // Heartbeat sender
        function startHeartbeatSender(intervalMs) {
            stopHeartbeat();
            heartbeatAckReceived = true;
            heartbeatInterval = setInterval(() => {
                if(!ws || ws.readyState !== WebSocket.OPEN) {
                    stopHeartbeat();
                    return;
                }
                if(!heartbeatAckReceived) {
                    addLog("💀 Heartbeat ACK lost → closing connection", "error");
                    fullCleanup();
                    isBotOnline = false;
                    updateLed(false);
                    addLog("❌ Bot disconnected due to zombie connection", "error");
                    return;
                }
                heartbeatAckReceived = false;
                sendJSON(1, lastSeq !== null ? lastSeq : null);
            }, intervalMs);
        }

        // MAIN WEBSOCKET CONNECTION
        function connectGateway(token) {
            if(ws && ws.readyState === WebSocket.OPEN) {
                addLog("⚠️ Active connection exists, stop current bot first", "error");
                return false;
            }
            intentionalClose = false;
            const gatewayURL = "wss://gateway.discord.gg/?v=10&encoding=json";
            addLog(`🌐 Connecting to Discord Gateway (wss://gateway.discord.gg) ...`, "info");
            ws = new WebSocket(gatewayURL);
            
            ws.onopen = () => {
                addLog("🔌 WebSocket opened, waiting for HELLO event...", "success");
            };
            
            ws.onmessage = (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    handleGatewayPayload(payload, token);
                } catch(err) {
                    addLog(`⚠️ JSON parse error: ${err.message}`, "error");
                }
            };
            
            ws.onerror = (err) => {
                addLog(`⚠️ WebSocket error occurred`, "error");
                console.error(err);
            };
            
            ws.onclose = (closeEvent) => {
                const wasOnline = isBotOnline;
                stopHeartbeat();
                isBotOnline = false;
                updateLed(false);
                if(!intentionalClose && wasOnline) {
                    addLog(`🔌 Unexpected close (code ${closeEvent.code}): ${closeEvent.reason || 'no reason'}`, "error");
                    if(reconnectAttempts < 4) {
                        reconnectAttempts++;
                        addLog(`🔄 Auto-reconnect attempt ${reconnectAttempts}/4 in ${reconnectAttempts * 2}s...`, "info");
                        setTimeout(() => {
                            if(!intentionalClose && currentToken && currentToken === token) {
                                connectGateway(currentToken);
                            }
                        }, reconnectAttempts * 2000);
                    } else {
                        addLog(`❌ Max reconnects reached. Start manually.`, "error");
                        reconnectAttempts = 0;
                    }
                } else if(intentionalClose) {
                    addLog(`⏹ Bot stopped manually.`, "info");
                } else {
                    addLog(`📡 Connection closed.`, "info");
                }
                ws = null;
            };
            return true;
        }
        
        // Handle all discord gateway events
        function handleGatewayPayload(payload, token) {
            const { op, d, t, s } = payload;
            if(s !== null && s !== undefined) lastSeq = s;
            
            switch(op) {
                case 10: // HELLO -> get heartbeat interval
                    const interval = d.heartbeat_interval;
                    expectedHeartbeatInterval = interval;
                    addLog(`💓 Heartbeat interval received: ${interval}ms`, "success");
                    startHeartbeatSender(interval);
                    sendIdentify(token);
                    break;
                case 11: // HEARTBEAT ACK
                    heartbeatAckReceived = true;
                    break;
                case 0: // DISPATCH
                    handleDispatch(t, d, token);
                    break;
                case 9: // INVALID SESSION
                    const resumable = d;
                    addLog(`🚫 INVALID SESSION (resumable: ${resumable}) - token might be revoked or incorrect.`, "error");
                    fullCleanup();
                    isBotOnline = false;
                    updateLed(false);
                    break;
                default:
                    // ignore other op codes
                    break;
            }
        }
        
        function handleDispatch(eventName, data, token) {
            switch(eventName) {
                case 'READY':
                    sessionId = data.session_id;
                    const user = data.user;
                    const botTag = `${user.username}#${user.discriminator || '0'}`;
                    addLog(`🎉 BOT ONLINE! Logged as: ${botTag} (ID: ${user.id})`, "success");
                    addLog(`✨ Gateway ready. Bot is visible online in Discord.`, "success");
                    isBotOnline = true;
                    updateLed(true);
                    reconnectAttempts = 0;
                    break;
                case 'RESUMED':
                    addLog(`🔄 Session resumed successfully.`, "success");
                    isBotOnline = true;
                    updateLed(true);
                    break;
                case 'GUILD_CREATE':
                    const guildName = data.name;
                    addLog(`📁 Guild loaded: ${guildName} (${data.id})`, "info");
                    break;
                case 'MESSAGE_CREATE':
                    if(data.author && !data.author.bot && data.content) {
                        let shortContent = data.content.length > 55 ? data.content.substring(0, 55) + '…' : data.content;
                        addLog(`💬 ${data.author.username}: ${escapeHtml(shortContent)}`, "info");
                    }
                    break;
                case 'READY_SUPPLEMENTAL':
                    // just ignore
                    break;
                default:
                    // optional: just ignore other events to reduce noise
                    break;
            }
        }
        
        // ---------- Public control methods ----------
        function startBot() {
            if(isBotOnline) {
                addLog("⚠️ Bot is already online! Stop it first if you want to restart.", "error");
                return;
            }
            let token = tokenInput.value.trim();
            if(!token) {
                addLog("❌ No token provided. Paste your Discord bot token.", "error");
                return;
            }
            // Basic pattern check: Discord tokens usually have alphanumeric, dots, underscores.
            if(!/^[A-Za-z0-9._-]+$/.test(token)) {
                addLog("⚠️ Token contains suspicious characters. Still attempting...", "error");
            }
            if(token.length < 50) {
                addLog("⚠️ Token length is quite short, ensure it's a full bot token.", "error");
            }
            // Force stop any previous zombie connection
            fullCleanup(false);
            currentToken = token;
            intentionalClose = false;
            addLog(`🚀 Launching bot with provided token...`, "info");
            addLog(`🔒 Establishing secure WebSocket to Discord.`, "info");
            connectGateway(token);
        }
        
        function stopBot() {
            intentionalClose = true;
            if(isBotOnline || (ws && ws.readyState === WebSocket.OPEN)) {
                addLog(`⏹ Shutting down bot connection...`, "info");
                fullCleanup();
                isBotOnline = false;
                updateLed(false);
                addLog(`✅ Bot disconnected from Discord Gateway.`, "success");
            } else {
                addLog(`ℹ️ No active bot connection.`, "info");
                fullCleanup();
                updateLed(false);
            }
            reconnectAttempts = 0;
        }
        
        // Attach listeners
        startBtn.addEventListener('click', startBot);
        stopBtn.addEventListener('click', stopBot);
        tokenInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') startBot();
        });
        
        // initial UI ready
        updateLed(false);
        addLog("🟢 SYSTEM READY — paste your BOT token and press START", "success");
        addLog("🔧 Make sure your token has bot scope and necessary intents enabled.", "info");
        addLog("📌 Example: Bot will show ONLINE with default activity.", "info");
    })();
</script>
</body>
</html>
